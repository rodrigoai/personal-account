default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  schema_search_path: public

development:
  <<: *default
  url: <%= ENV.fetch("DEVELOPMENT_DATABASE_URL", "postgresql://127.0.0.1/personal_account_development") %>
test:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  schema_search_path: public
  template: template0
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql://127.0.0.1/personal_account_test") %>
production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>
